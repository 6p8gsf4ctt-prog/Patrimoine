name: Actualiser les cours boursiers

"on":
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer la source de cotations
        run: pip install "yfinance==1.7.0"

      - name: Mettre à jour les cours
        run: python scripts/update_market_prices.py

      - name: Publier le fichier si nécessaire
        run: |
          if git diff --quiet -- assets/market-prices.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/market-prices.json
          git commit -m "Actualiser les cours boursiers"
          git push
