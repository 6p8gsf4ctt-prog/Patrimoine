<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Gestion locale et hors ligne de votre patrimoine." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Mon Patrimoine</title>
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">GESTION LOCALE</span><h1>Mon Patrimoine</h1></div>
    <button id="installBtn" class="secondary hidden">Installer</button>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button data-view="dashboard" class="active"><span>◫</span>Accueil</button>
    <button data-view="portfolio"><span>◉</span>Portefeuille</button>
    <button data-view="transactions"><span>↕</span>Historique</button>
    <button data-view="settings"><span>⚙</span>Réglages</button>
  </nav>

  <dialog id="transactionDialog">
    <form id="transactionForm" method="dialog" class="form-grid">
      <div class="dialog-head"><h2 id="dialogTitle">Ajouter une opération</h2><button type="button" class="icon-btn" data-close>×</button></div>
      <input type="hidden" name="id" />
      <label>Symbole<input name="assetSymbol" required maxlength="12" placeholder="BTC" /></label>
      <label>Nom de l’actif<input name="assetName" required placeholder="Bitcoin" /></label>
      <label>Catégorie<select name="category"><option>Crypto</option><option>ETF</option><option>PEE</option><option>Livrets</option><option>Liquidités</option><option>Autre</option></select></label>
      <label>Compte<input name="account" required placeholder="Crypto" /></label>
      <label>Type<select name="type"><option value="BUY">Achat</option><option value="SELL">Vente</option><option value="BALANCE">Solde</option><option value="CONTRIBUTION">Apport</option><option value="WITHDRAWAL">Retrait</option></select></label>
      <label>Date<input name="date" type="date" required /></label>
      <label>Quantité<input name="quantity" type="number" step="any" required /></label>
      <label>Prix unitaire<input name="unitPrice" type="number" step="any" required /></label>
      <label>Frais<input name="fees" type="number" step="any" value="0" /></label>
      <label>Devise<select name="currency"><option>EUR</option><option>USD</option></select></label>
      <label class="full">Note<textarea name="note" rows="2"></textarea></label>
      <div class="dialog-actions full"><button type="button" class="secondary" data-close>Annuler</button><button class="primary" value="default">Enregistrer</button></div>
    </form>
  </dialog>

  <script src="./app.js" defer></script>
</body>
</html>
